[project]
name = "sj-trading"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "polars-talib>=0.1.3",
    "polars>=1.9.0",
    "python-dotenv>=1.0.1",
    "backtrader>=1.9.78.123",
    "pandas>=2.2.3",
    "matplotlib>=3.10.1",
    "yfinance>=0.2.54",
    "finmind>=1.7.8",
    "tqdm>=4.67.1",
    "click>=8.1.7",
    "rich==13.7.1",
    "prompt-toolkit>=3.0.47",
]

[project.scripts]
opt_strategy = "workflow:main"
simulate = "sj_trading.simulation:simulate"
download_data = "sj_trading.download_data:download_data_cli"
zip = "zip:zip_project_folder"
run_strategy = "run_strategy:run_strategy_cli"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "ipykernel>=6.29.5",
]

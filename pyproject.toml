[project]
name = "sj-trading"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "polars-talib>=0.1.3",
    "polars>=1.9.0",
    "python-dotenv>=1.0.1",
    "shioaji[speed]>=1.2.5",
    "backtrader>=1.9.78.123",
    "pandas>=2.2.3",
    "matplotlib>=3.10.1",
    "yfinance>=0.2.54",
    "finmind>=1.7.8",
    "tqdm>=4.67.1",
]

[project.scripts]
hello = "sj_trading:hello"
main = "sj_trading:main"
version = "sj_trading:show_version"
stock_testing = "sj_trading.testing_flow:testing_stock_ordering"
futures_testing = "sj_trading.testing_flow:testing_futures_ordering"
lookup_target = "workflow:main"
simulate = "workflow:simulate"
check_target = "workflow:check_target"
download_data = "workflow:download_data_cli"
generate_google_query = "generate_query:main"
zip = "zip:zip_project_folder"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "ipykernel>=6.29.5",
]
